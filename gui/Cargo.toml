[package]
name = "xbo360-gui"
version = "0.3.1"
edition = "2024"
description = "Xbox 360 Recomp workbench using ReXGlue"
license = "Apache-2.0"
publish = false

[[bin]]
name = "Xbox360Recomp"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
