name: ViaXTrace Xbox360RecompAndroid

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viaxtrace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso-parser:
    name: Native ISO/XISO parser (synthetic tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test ISO/XISO parser
        run: |
          g++ -std=c++20 -O0 -g -Wall -Wextra \
            native/src/loader/iso_parser.cpp tests/iso_parser_smoke.cpp \
            -o /tmp/iso_parser_smoke
          /tmp/iso_parser_smoke

  iso-xex-pipeline:
    name: ISO to XEX2 integration and metadata lifetime (ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run synthetic ISO to XEX2 regression tests
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -Wpedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            native/src/loader/iso_parser.cpp native/src/loader/xex_loader.cpp \
            native/src/loader/aes128.cpp tests/iso_xex_pipeline_smoke.cpp -o /tmp/iso_xex_pipeline_smoke
          /tmp/iso_xex_pipeline_smoke

  xex2-loader:
    name: Native XEX2 loader (synthetic security and optional headers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run XEX2 reader unit fixtures
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -Wpedantic \
            native/src/loader/xex_loader.cpp native/src/loader/aes128.cpp \
            tests/xex_loader_smoke.cpp \
            -o /tmp/xex_loader_smoke
          /tmp/xex_loader_smoke

  aes-xex2:
    name: AES-128 NIST vectors and retail XEX2 decryption (ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test AES ECB/CBC and encrypted synthetic XEX2 fixtures
        run: |
          g++ -std=c++20 -O1 -g -Wall -Wextra -Wpedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            native/src/loader/xex_loader.cpp native/src/loader/aes128.cpp \
            tests/aes_xex2_smoke.cpp -o /tmp/aes_xex2_smoke
          /tmp/aes_xex2_smoke

  android:
    name: Android ARM64 Flutter and native JIT APK
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.0'
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install NDK and CMake
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.3.11579264' 'cmake;3.22.1'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
            android/.cxx
          key: viax-android-${{ runner.os }}-${{ hashFiles('pubspec.yaml', 'android/**/*.gradle', 'native/**/*.cpp', 'native/**/*.h') }}
          restore-keys: |
            viax-android-${{ runner.os }}-
      - name: Fetch Flutter dependencies
        run: flutter pub get
      - name: Generate Riverpod / Freezed / Hive sources
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Verify diagnostic UI states
        run: flutter test test/gpu_diagnostics_test.dart
      - name: Flutter analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Compile debug Android ARM64 APK
        run: flutter build apk --debug --target-platform android-arm64
      - name: Verify packaged ARM64 JNI/FFI ABI
        run: python3 ci/check_ffi_abi.py build/app/outputs/flutter-apk/app-debug.apk
      - name: Verify APK exists
        run: test -s build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ViaXTrace-Xbox360RecompAndroid-ARM64
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
